# merge-gate v5, installed by the ship skill; upgrade from there, not by hand.
name: Merge gate

# pull_request_target runs the base branch's copy of this workflow and policy, so a PR cannot loosen its own gate.
# Never check out or run PR code here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  status:
  merge_group:

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.event.sha || github.event.merge_group.head_sha }}

jobs:
  gate:
    if: github.event_name != 'status' || github.event.context == 'agent-review'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # A queued PR already passed merge-gate on its head; report the required check on the queue's SHA.
      - name: Merge queue
        if: github.event_name == 'merge_group'
        env:
          SHA: ${{ github.event.merge_group.head_sha }}
        run: gh api "repos/$GH_REPO/statuses/$SHA" -f state=success -f context=merge-gate -f description="queued" >/dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'merge_group'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github

      - name: Evaluate
        if: github.event_name != 'merge_group'
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.sha }}
        run: |
          pr=${PR:-$(gh api "repos/$GH_REPO/commits/$SHA/pulls" --jq '[.[] | select(.state == "open")][0].number // empty')}
          [ -n "$pr" ] || exit 0
          head=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
          policy=.github/merge-policy.json
          mode=$(jq -r .mode $policy)
          # Required check: proves this exact head was evaluated, so a later push waits for re-evaluation.
          verdict() { gh api "repos/$GH_REPO/statuses/$head" -f state="$1" -f context=merge-gate -f description="$2" >/dev/null; }
          has_label() { gh pr view "$pr" --json labels --jq '.labels[].name' | grep -qx ship; }
          # Disarm only auto-merge the gate armed; a failed disarm fails the job so no success status is posted.
          disarm() {
            by=$(gh pr view "$pr" --json autoMergeRequest --jq '.autoMergeRequest.enabledBy.login // empty')
            if [ "$by" = "github-actions" ]; then gh pr merge "$pr" --disable-auto; fi
          }

          if ! has_label; then
            disarm
            gh pr edit "$pr" --remove-label ship:eligible --remove-label needs-human >/dev/null 2>&1 || true
            verdict success "not a ship PR: manual merge"
            exit 0
          fi

          # A head whose patch matches one approved on an earlier commit of this PR (a base merge) keeps the approval.
          reattest() {
            latest() {
              local pages
              pages=$(gh api --paginate "repos/$GH_REPO/commits/$1/statuses") || return 1
              jq -sc '[add[] | select(.context == "agent-review")][0] // empty' <<<"$pages"
            }
            # Same whole-description suffix test as merge-gate.sh, so only an approval the gate accepts is copied.
            approves() { latest "$1" | jq -e --arg p "$patch" 'select(.state == "success") | .description | endswith("approved patch " + $p)' >/dev/null; }
            # Any agent-review on the head, even failure or pending, is the agent's call, not ours; an unreadable head is too.
            current=$(latest "$head") || return 0
            [ -z "$current" ] || return 0
            # --verbatim: --stable ignores whitespace, so `rm -rf /tmp/x` and `rm -rf / tmp/x` match.
            patch=$(gh pr diff "$pr" --color never | git patch-id --verbatim | cut -c1-12)
            [ -n "$patch" ] || return 0
            for sha in $(gh api --paginate "repos/$GH_REPO/pulls/$pr/commits" --jq '.[].sha'); do
              if approves "$sha"; then
                gh api "repos/$GH_REPO/statuses/$head" -f state=success -f context=agent-review \
                  -f description="re-attested from ${sha:0:7}: approved patch $patch" >/dev/null
                return 0
              fi
            done
          }
          reattest

          reasons=$(.github/scripts/merge-gate.sh "$pr" "$head")
          gh label create ship:eligible --color 0e8a16 --force >/dev/null
          gh label create needs-human --color d93f0b --force >/dev/null

          if [ -z "$reasons" ]; then
            gh pr edit "$pr" --add-label ship:eligible --remove-label needs-human
            echo "### #$pr eligible for auto-merge ($mode)" >>"$GITHUB_STEP_SUMMARY"
            verdict success "eligible ($mode)"
            if [ "$mode" = enforce ] && has_label; then
              gh pr merge "$pr" --auto --squash --match-head-commit "$head"
            fi
          else
            gh pr edit "$pr" --add-label needs-human --remove-label ship:eligible
            { echo "### #$pr needs a human ($mode)"; sed 's/^/- /' <<<"$reasons"; } >>"$GITHUB_STEP_SUMMARY"
            disarm
            state=success
            [ "$mode" = enforce ] && state=failure
            verdict "$state" "needs-human, remove ship to merge by hand: $(head -1 <<<"$reasons" | cut -c1-80)"
          fi
          exit 0
